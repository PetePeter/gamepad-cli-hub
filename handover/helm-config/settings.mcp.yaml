# Snippet of ~/Helm/config/settings.yaml — the `mcp:` block only.
# Merge this into the real settings.yaml on the new Mac (don't overwrite the
# whole file; the rest of settings.yaml is machine/runtime state).
#
# IMPORTANT: authToken below is a PLACEHOLDER — the live machine used a throwaway
# value that is deliberately NOT committed. Set a real shared secret and use the
# SAME value in the Claude-side helm MCP header (see ../claude-config/README).
#
# IMPORTANT: port must match the Claude-side helm MCP url. See STATE.md "What's next".
mcp:
  enabled: true
  port: 47421          # was 47373 on the old Mac — see STATE.md; Claude config expects 47421
  authToken: "REPLACE_WITH_SHARED_SECRET"
